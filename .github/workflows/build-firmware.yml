name: Build Firmware

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 10
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y build-essential clang gcc g++ binutils bzip2 gawk gettext git \
            libncurses-dev libssl-dev python3 python3-setuptools rsync unzip wget xsltproc \
            zlib1g-dev file which perl sed make
      - name: Install feeds
        run: |
          ./scripts/feeds update -a
          ./scripts/feeds install -a
      - name: Configure
        run: |
          make defconfig
          echo 'CONFIG_TARGET_airoha=y' >> .config
          echo 'CONFIG_TARGET_airoha_an7581=y' >> .config
          echo 'CONFIG_TARGET_DEVICE_airoha_an7581_gemtek_xg2010g=y' >> .config
          make defconfig
      - name: Build
        run: make -j2 world 2>&1 | tee build.log
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: xg2010g-firmware
          path: |
            bin/targets/airoha/an7581/*
            build.log
